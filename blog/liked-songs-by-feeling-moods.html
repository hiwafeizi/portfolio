<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>24 moods found in my music library</title>
<style>:root {
  --bg: #111214; --panel: #1a1b1f; --panel2: #222329; --line: #2e3037;
  --fg: #ececec; --mut: #9a9ca3; --dim: #6c6e75;
  --acc: #8fa8ff; --acc-ink: #0d1330; --ok: #6fd99a; --warn: #ffc86b; --bad: #ff7b7b;
  --r: 10px; --side: 250px; --player: 72px;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --panel2: #f0efeb; --line: #e2e0da;
    --fg: #1c1c1e; --mut: #62646b; --dim: #8e9097;
    --acc: #3f5fe0; --acc-ink: #ffffff; --ok: #1f9a57; --warn: #b7791f; --bad: #d64545;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 14.5px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--bg); color: var(--fg);
  display: grid; grid-template-columns: var(--side) 1fr; grid-template-rows: 1fr var(--player);
}
a { color: var(--acc); }
button, input, select { font: inherit; color: inherit; }
kbd {
  font: 11px ui-monospace, monospace; padding: 1px 5px; border-radius: 4px;
  border: 1px solid var(--line); background: var(--panel2); color: var(--mut);
}

/* sidebar */
.side { grid-row: 1 / 2; border-right: 1px solid var(--line); padding: 20px 14px; overflow: auto; background: var(--panel); }
.brand { font-weight: 700; font-size: 20px; letter-spacing: -.3px; }
.logo { color: var(--acc); }
.tag { color: var(--mut); margin: 2px 0 18px; font-size: 13px; }
#steps a {
  display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: center;
  padding: 9px 10px; border-radius: 8px; color: var(--fg); text-decoration: none; margin-bottom: 2px;
}
#steps a:hover { background: var(--panel2); }
#steps a.on { background: var(--panel2); box-shadow: inset 3px 0 0 var(--acc); }
#steps .n {
  width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  border: 1.5px solid var(--line); font-size: 12px; color: var(--mut);
}
#steps .done .n { background: var(--ok); border-color: var(--ok); color: #0b2415; font-weight: 700; }
#steps .run .n { border-color: var(--acc); color: var(--acc); animation: pulse 1.2s infinite; }
#steps .t { font-weight: 550; line-height: 1.2; }
#steps .s { display: block; font-size: 12px; color: var(--mut); font-weight: 400; }
@keyframes pulse { 50% { opacity: .35; } }
.side-foot { margin-top: 18px; font-size: 12px; color: var(--dim); }

/* main */
main { overflow: auto; padding: 28px 34px 40px; }
.wrap { max-width: 1180px; margin: 0 auto; }
h1 { font-size: 26px; letter-spacing: -.4px; margin: 0 0 4px; }
h2 { font-size: 17px; margin: 0; }
.lead { color: var(--mut); margin: 0 0 22px; max-width: 760px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; margin-bottom: 16px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
.mut { color: var(--mut); }
.small { font-size: 12.5px; }
.btn {
  border: 1px solid var(--line); background: var(--panel2); border-radius: 8px;
  padding: 8px 14px; cursor: pointer; font-weight: 550; white-space: nowrap;
}
.btn:hover { border-color: var(--dim); }
.btn.primary { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn .k { margin-left: 8px; opacity: .7; font-size: 11px; }
input[type=text], input[type=password], input[type=number], input[type=search], select {
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; outline: none;
}
input:focus, select:focus { border-color: var(--acc); }
label.f { display: block; font-size: 12.5px; color: var(--mut); margin: 10px 0 4px; }
.field { width: 100%; }
ol.how { padding-left: 20px; margin: 8px 0 0; } ol.how li { margin-bottom: 6px; }
code.copy { background: var(--panel2); padding: 2px 7px; border-radius: 6px; cursor: pointer; border: 1px dashed var(--line); }
.pill { display: inline-block; padding: 2px 9px; border-radius: 99px; background: var(--panel2); font-size: 12px; color: var(--mut); }
.pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); }

/* job panel */
.job { margin-top: 16px; }
.bar { height: 8px; background: var(--panel2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--acc); transition: width .4s; }
.bar.indet > i { width: 30%; animation: indet 1.3s infinite ease-in-out; }
@keyframes indet { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
.jobline { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--mut); margin-top: 6px; }
pre.log {
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  max-height: 180px; overflow: auto; font-size: 12px; color: var(--mut); margin: 12px 0 0; white-space: pre-wrap;
}
.stats { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
.stat { background: var(--panel2); border-radius: 8px; padding: 10px 14px; min-width: 120px; }
.stat b { display: block; font-size: 22px; }
.stat span { font-size: 12px; color: var(--mut); }

/* songs */
.song {
  display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center;
  padding: 4px 6px; border-radius: 7px; cursor: pointer;
}
.song:hover { background: var(--panel2); }
.song.playing { background: color-mix(in srgb, var(--acc) 16%, transparent); }
.song .pb {
  width: 26px; height: 26px; border-radius: 50%; border: 0; background: var(--panel2);
  cursor: pointer; font-size: 10px; display: grid; place-items: center;
}
.song.playing .pb { background: var(--acc); color: var(--acc-ink); }
.song .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.song .nm small { color: var(--mut); margin-left: 6px; }
.song.noaudio .pb { opacity: .35; }

/* liked songs that couldn't be found */
.notice { border-left: 3px solid var(--warn); background: var(--panel2); padding: 10px 14px; border-radius: 6px; margin-top: 12px; font-size: 13.5px; }
.notice details summary { cursor: pointer; color: var(--mut); margin-top: 8px; font-size: 12.5px; }
.notice .missing { max-height: 360px; overflow-y: auto; margin-top: 6px; }
.notice .missing .song { grid-template-columns: minmax(0, 1fr) auto; cursor: default; }

/* groups */
.toolbar { display: flex; gap: 14px; align-items: end; flex-wrap: wrap; }
.toolbar .f { margin: 0 0 4px; }
.mapbox { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 16px; }
.mapbox canvas { display: block; width: 100%; height: 440px; cursor: crosshair; }
.maptip {
  position: absolute; pointer-events: none; background: var(--panel2); border: 1px solid var(--line);
  padding: 5px 9px; border-radius: 7px; font-size: 12.5px; display: none; white-space: nowrap;
}
.maphelp { padding: 2px 12px 8px; text-align: right; font-size: 12px; color: var(--dim); }
.maplegend { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px 4px; border-top: 1px solid var(--line); }
.maplegend .lg { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 99px;
  border: 1px solid var(--line); background: var(--panel2); color: var(--fg); font-size: 12px; cursor: pointer; }
.maplegend .lg:hover { border-color: var(--mut); }
.maplegend .lg i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.maplegend .lg small { color: var(--mut); }
.maplegend .lg.on { border-color: var(--acc); background: color-mix(in srgb, var(--acc) 22%, var(--panel2)); font-weight: 600; }
.maplegend .lg.clear { color: var(--mut); }
.maplegend .lg[hidden] { display: none; }
.groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; padding-bottom: 80px; }
.g { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; transition: opacity .2s, border-color .2s; }
.g.dropped { opacity: .5; }
.g.merged { border-style: dashed; }
.g.named { border-color: color-mix(in srgb, var(--gc) 55%, var(--line)); }
.g-head { display: flex; gap: 8px; align-items: center; }
.g-num { font-size: 12px; color: var(--mut); white-space: nowrap; flex: none; }
.g-meta a { color: inherit; text-decoration: underline dotted; cursor: pointer; }
.g.flash { border-color: var(--acc); box-shadow: 0 0 0 2px color-mix(in srgb, var(--acc) 35%, transparent); }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.g-name { flex: 1; min-width: 0; font-weight: 600; font-size: 15px; background: transparent; border: 1px solid transparent; padding: 4px 6px; }
.g-name:hover { border-color: var(--line); }
.g .aud { padding: 6px 10px; flex: none; }
.g-meta { font-size: 12.5px; color: var(--mut); margin: 4px 0 10px; }
.prof { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 14px; margin-bottom: 10px; }
.pr { display: grid; grid-template-columns: 78px 1fr; font-size: 11.5px; color: var(--mut); align-items: center; }
.pr i { height: 6px; background: var(--panel2); border-radius: 3px; position: relative; }
.pr i::before { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--dim); }
.pr u { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: var(--gc); }
.g details summary { cursor: pointer; font-size: 12.5px; color: var(--mut); margin-top: 6px; }
.savebar {
  position: sticky; bottom: 0; margin: 0 -34px -40px; padding: 12px 34px;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
  border-top: 1px solid var(--line); display: flex; align-items: center; gap: 14px;
}

/* review */
.rv { display: grid; grid-template-columns: 1fr 300px; gap: 16px; align-items: start; }
.rv-card { padding: 26px 28px; }
.rv-title { font-size: 26px; font-weight: 700; letter-spacing: -.3px; line-height: 1.2; }
.rv-sub { color: var(--mut); font-size: 15px; margin: 4px 0 16px; }
.torn { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--mut); margin-bottom: 18px; }
.torn .bar { width: 160px; }
.torn .bar > i { background: var(--warn); }
.choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.choice {
  display: flex; align-items: center; gap: 10px; text-align: left; padding: 11px 13px;
  border-radius: 9px; border: 1px solid var(--line); background: var(--panel2); cursor: pointer; font-weight: 550;
}
.choice:hover { border-color: var(--acc); }
.choice.auto { border-color: color-mix(in srgb, var(--acc) 60%, var(--line)); }
.choice small { display: block; font-weight: 400; color: var(--mut); font-size: 11.5px; }
.choice kbd { margin-left: auto; }
.choice.flash { background: var(--acc); color: var(--acc-ink); }
.rv-keys { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.upnext .song { grid-template-columns: 30px 1fr; }
.done-big { text-align: center; padding: 50px 20px; }
.done-big b { font-size: 44px; display: block; }

/* playlists */
.pl { display: grid; grid-template-columns: 250px 1fr; gap: 16px; align-items: start; }
.pl-list a {
  display: flex; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 8px;
  color: var(--fg); text-decoration: none; cursor: pointer;
}
.pl-list a:hover { background: var(--panel2); }
.pl-list a.on { background: var(--panel2); box-shadow: inset 3px 0 0 var(--acc); }
.pl-list a span { color: var(--mut); font-size: 12.5px; }
.pl-list hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0; }
.chips { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; justify-content: flex-end; }
.chip { font-size: 11.5px; padding: 2px 4px 2px 9px; border-radius: 99px; background: var(--panel2); display: inline-flex; gap: 3px; align-items: center; }
.chip button { border: 0; background: transparent; cursor: pointer; color: var(--dim); padding: 0 4px; }
.chip button:hover { color: var(--bad); }
.chip.cur { background: color-mix(in srgb, var(--acc) 22%, var(--panel2)); }
select.add { font-size: 11.5px; padding: 2px 6px; border-radius: 99px; }
.pl-rows .song { grid-template-columns: 30px minmax(0, 1fr) auto; }
.edited { font-size: 11px; color: var(--warn); }

/* player */
.player {
  grid-column: 1 / -1; border-top: 1px solid var(--line); background: var(--panel);
  display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; padding: 0 20px;
}
.p-ctrl { display: flex; gap: 6px; align-items: center; }
.icon { border: 0; background: transparent; cursor: pointer; font-size: 16px; color: var(--fg); padding: 6px; text-decoration: none; }
.icon.big { width: 42px; height: 42px; border-radius: 50%; background: var(--acc); color: var(--acc-ink); font-size: 16px; }
.p-info { min-width: 0; }
.p-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-sub { font-size: 12.5px; color: var(--mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-bar { height: 4px; background: var(--panel2); border-radius: 2px; margin-top: 6px; cursor: pointer; }
.p-bar i { display: block; height: 100%; width: 0; background: var(--acc); border-radius: 2px; }
.p-opts { display: flex; gap: 12px; align-items: center; }
.toggle { font-size: 12.5px; color: var(--mut); display: flex; gap: 5px; align-items: center; cursor: pointer; }

.toast {
  position: fixed; bottom: calc(var(--player) + 16px); left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 8px; opacity: 0;
  transition: .25s; pointer-events: none; font-weight: 550; z-index: 9;
}
.toast.show { opacity: 1; transform: translateX(-50%); }

@media (max-width: 900px) {
  body { grid-template-columns: 1fr; grid-template-rows: auto 1fr var(--player); }
  .side { grid-row: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 12px 16px; }
  #steps { display: flex; overflow-x: auto; gap: 4px; }
  #steps a { grid-template-columns: 26px auto; white-space: nowrap; }
  #steps .s, .tag, .side-foot { display: none; }
  main { padding: 18px 16px 30px; }
  .rv, .pl { grid-template-columns: 1fr; }
  .savebar { margin: 0 -16px -30px; padding: 12px 16px; }
}

body.export { display: block; } body.export main { overflow: visible; padding-bottom: 120px; }
#player { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 14px; background: var(--panel); border-top: 1px solid var(--line); z-index: 5; }
#player[hidden] { display: none; } #player iframe { border: 0; border-radius: 12px; display: block; }</style></head>

<script>"use strict";
/* The mood map, shared by the app and the exported page: songs placed sad <-> happy and
   relaxed <-> aggressive (see MAP_AXES in app.py), each group's name at the centre of its dots,
   and under it one button per playlist: click to pin it on the map, hover to preview.
   opts: name(c) -> the group's name · label(c) -> name with its number · song(id) -> "title — artist"
         playlists() -> [{name, color, groups}] (see moodPlaylists) · onPick(id), optional: clicking
         a dot plays it · help: caption under the map */

// The playlists the groups will become: a merged group joins its target, a dropped one is left out.
// info(c) -> {name, action} as on the group's card.
function moodPlaylists(G, info) {
  const byName = new Map(), colorOf = Object.fromEntries(G.groups.map(g => [g.id, g.color]));
  for (const g of G.groups) {
    let c = g.id, act = info(c).action;
    for (const seen = new Set(); act.startsWith("merge:") && !seen.has(c); act = info(c).action) { seen.add(c); c = +act.slice(6); }
    if (act === "drop" || act.startsWith("merge:")) continue;  // dropped, or a merge loop: its songs get re-homed
    const name = info(c).name || `Group ${c}`, key = name.toLowerCase();  // the same name is one playlist
    if (!byName.has(key)) byName.set(key, { name, color: colorOf[c], groups: [] });
    byName.get(key).groups.push(g.id);
  }
  return [...byName.values()];
}

function moodMap(G, opts) {
  const make = (tag, cls) => { const n = document.createElement(tag); if (cls) n.className = cls; return n; };
  const cv = make("canvas"), tip = make("div", "maptip"), legend = make("div", "maplegend"), help = make("div", "maphelp");
  const node = make("div", "mapbox");
  help.textContent = opts.help || "";
  node.append(cv, tip, legend, help);
  if (!opts.onPick) cv.style.cursor = "default";
  const own = Object.fromEntries(G.groups.map(g => [g.id, g.color])), color = { ...own };  // a merged group takes its playlist's colour
  const size = Object.fromEntries(G.groups.map(g => [g.id, g.size]));
  let hover = null, pinned = null, pinnedName = null, W = 0, H = 0, pts = [];  // hover/pinned: sets of group ids
  const lit = () => hover || pinned;  // what's highlighted: a hovered card or button, else the pinned playlist
  const cssVar = (name, fallback) => getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback;

  let shown = "";
  function renderLegend() {  // rebuilt only when names or merges change, so hovering a button can't flicker
    const list = opts.playlists ? opts.playlists() : [];
    const key = JSON.stringify(list.map(p => [p.name, p.color, p.groups]));
    if (key !== shown) {
      shown = key;
      const now = list.find(p => p.name === pinnedName);  // a pinned playlist survives renames of others
      pinned = now ? new Set(now.groups) : null; pinnedName = now ? now.name : null;
      Object.assign(color, own); for (const p of list) for (const c of p.groups) color[c] = p.color;
      legend.replaceChildren(...list.map(p => {
        const b = make("button", "lg"); b.dataset.name = p.name; b.title = "Click to pin on the map, again to clear";
        const dot = make("i"); dot.style.background = p.color;
        const n = make("small"); n.textContent = p.groups.reduce((s, c) => s + (size[c] || 0), 0);
        b.append(dot, p.name, n);
        b.onclick = () => { const off = pinnedName === p.name; pinned = off ? null : new Set(p.groups); pinnedName = off ? null : p.name; hover = null; draw(); };
        b.onmouseenter = () => { hover = new Set(p.groups); draw(); };
        b.onmouseleave = () => { hover = null; draw(); };
        return b;
      }), Object.assign(make("button", "lg clear"), { textContent: "show all", onclick: () => { pinned = pinnedName = null; draw(); } }));
    }
    legend.querySelectorAll(".lg").forEach(b => b.classList.toggle("on", b.dataset.name === pinnedName));
    legend.querySelector(".clear").hidden = !pinnedName;
  }

  function draw() {
    renderLegend();
    const r = cv.getBoundingClientRect(); if (!r.width) return;
    const dpr = devicePixelRatio || 1; W = r.width; H = r.height;
    cv.width = W * dpr; cv.height = H * dpr;
    const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr); ctx.clearRect(0, 0, W, H);
    pts = G.points.map(([id, x, y, c]) => [id, 14 + x * (W - 28), 14 + (1 - y) * (H - 28), c]);
    drawGuides(ctx);
    const L = lit();
    for (const pass of [0, 1]) for (const [, x, y, c] of pts) {
      const on = !L || L.has(c);
      if ((pass === 1) !== (on && !!L)) continue;
      ctx.globalAlpha = on ? .85 : .12; ctx.fillStyle = color[c];
      ctx.beginPath(); ctx.arc(x, y, on && L ? 3.4 : 2.6, 0, 7); ctx.fill();
    }
    const dirs = directionLabels(ctx);
    drawNames(ctx, dirs.map(d => d.box));
    drawDirections(ctx, dirs);
  }
  function drawGuides(ctx) {  // centre lines: the library's average song
    ctx.save(); ctx.strokeStyle = cssVar("--dim", "#6c6e75"); ctx.globalAlpha = .35; ctx.setLineDash([4, 6]);
    ctx.beginPath(); ctx.moveTo(W / 2, 8); ctx.lineTo(W / 2, H - 8); ctx.moveTo(8, H / 2); ctx.lineTo(W - 8, H / 2); ctx.stroke();
    ctx.restore();
  }
  function directionLabels(ctx) {  // what each side and corner means, and the space each takes
    const side = "600 12px system-ui, sans-serif", corner = "italic 11px system-ui, sans-serif";
    return [["← Sad", 8, H / 2 - 5, "left", "bottom", side], ["Happy →", W - 8, H / 2 - 5, "right", "bottom", side],
            ["↑ Aggressive", W / 2 + 6, 6, "left", "top", side], ["↓ Relaxed", W / 2 + 6, H - 6, "left", "bottom", side],
            ["angry", 8, 6, "left", "top", corner], ["hype", W - 8, 6, "right", "top", corner],
            ["melancholic", 8, H - 6, "left", "bottom", corner], ["peaceful", W - 8, H - 6, "right", "bottom", corner]]
      .map(([t, x, y, align, base, font]) => {
        ctx.font = font;
        const w = ctx.measureText(t).width, x0 = align === "left" ? x : x - w, y0 = base === "top" ? y : y - 14;
        return { t, x, y, align, base, font, box: [x0 - 2, y0 - 2, x0 + w + 2, y0 + 16] };
      });
  }
  function drawDirections(ctx, labels) {
    ctx.save(); ctx.fillStyle = cssVar("--mut", "#9a9ca3"); ctx.strokeStyle = cssVar("--panel", "#1a1b1f"); ctx.lineWidth = 3;
    for (const l of labels) {
      ctx.font = l.font; ctx.textAlign = l.align; ctx.textBaseline = l.base; ctx.globalAlpha = l.font === labels[0].font ? 1 : .75;
      ctx.strokeText(l.t, l.x, l.y); ctx.fillText(l.t, l.x, l.y);
    }
    ctx.restore();
  }
  function drawNames(ctx, reserved) {  // each group's name at the centre of its dots; bigger groups first, no overlaps
    const sum = {};
    for (const [, x, y, c] of pts) { const s = sum[c] || (sum[c] = [0, 0, 0]); s[0] += x; s[1] += y; s[2]++; }
    const boxes = [...reserved];  // keep the direction labels readable
    const hit = b => boxes.some(o => b[0] < o[2] && b[2] > o[0] && b[1] < o[3] && b[3] > o[1]);
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
    const L = lit(), isLit = c => !!L && L.has(c);
    const order = Object.keys(sum).map(Number).sort((a, b) => isLit(b) - isLit(a) || sum[b][2] - sum[a][2]);
    for (const c of order) {
      const name = opts.name(c), mine = isLit(c);
      ctx.font = `${mine ? 700 : 600} ${mine ? 13 : 11}px system-ui, sans-serif`;
      const w = ctx.measureText(name).width, h = mine ? 16 : 13;
      const x = Math.min(Math.max(sum[c][0] / sum[c][2], w / 2 + 3), W - w / 2 - 3), cy = sum[c][1] / sum[c][2];
      let box = null, y = cy;
      for (const dy of [0, -(h + 1), h + 1]) {  // at the centre, else just above or below it
        const yy = Math.min(Math.max(cy + dy, h / 2 + 2), H - h / 2 - 2), b = [x - w / 2 - 2, yy - h / 2, x + w / 2 + 2, yy + h / 2];
        if (mine || !hit(b)) { box = b; y = yy; break; }
      }
      if (!box) continue;  // no room: hover its card to see it
      boxes.push(box);
      ctx.globalAlpha = !L || mine ? 1 : .45;
      ctx.lineWidth = 3; ctx.strokeStyle = cssVar("--panel", "#1a1b1f"); ctx.strokeText(name, x, y);
      ctx.fillStyle = mine ? color[c] : cssVar("--fg", "#ececec"); ctx.fillText(name, x, y);
    }
    ctx.globalAlpha = 1;
  }

  const near = e => {
    const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    let best = null, bd = 64;
    for (const p of pts) { const d = (p[1] - mx) ** 2 + (p[2] - my) ** 2; if (d < bd) { bd = d; best = p; } }
    return [best, mx, my];
  };
  cv.onmousemove = e => {
    const [p, mx, my] = near(e);
    if (!p) { tip.style.display = "none"; return; }
    tip.textContent = `${opts.song(p[0])}  ·  ${opts.label(p[3])}`;
    tip.style.display = "block"; tip.style.left = Math.min(mx + 12, W - tip.offsetWidth - 6) + "px"; tip.style.top = (my + 12) + "px";
  };
  cv.onmouseleave = () => tip.style.display = "none";
  if (opts.onPick) cv.onclick = e => { const [p] = near(e); if (p) opts.onPick(p[0]); };
  new ResizeObserver(draw).observe(cv);
  // focus(c): a card is hovered (null = left it; the pinned playlist, if any, shows again)
  // refresh(): names or merges changed on the cards
  return { node, focus(c) { hover = c === null ? null : new Set([c]); draw(); }, refresh: draw };
}
</script><script>"use strict";
/* The exported "Find & name moods" page (a single HTML file, e.g. for a blog). Its data,
   styles and the shared mood map are inlined by the app's "Save page" button. Songs play
   through Spotify's own embed player: the app's local preview clips aren't ours to republish. */
(() => {
  const D = JSON.parse(document.getElementById("data").textContent);
  function el(tag, props, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "style") for (const [sk, sv] of Object.entries(v)) sk.startsWith("--") ? n.style.setProperty(sk, sv) : (n.style[sk] = sv);
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    }
    for (const c of kids.flat(Infinity)) if (c != null && c !== false) n.append(c.nodeType ? c : String(c));
    return n;
  }
  const byId = Object.fromEntries(D.groups.map(g => [g.id, g]));
  const playlists = () => moodPlaylists(D, c => ({ name: byId[c].name, action: byId[c].action }));
  const name = c => (playlists().find(p => p.groups.includes(c)) || {}).name || byId[c].name || `Group ${c}`;
  const label = c => byId[c].name ? `${byId[c].name} (Group ${c})` : `Group ${c}`;
  const song = id => D.songs[id] || [id, ""];

  // ---- player: one Spotify embed at the bottom, created by the first ▶
  const bar = document.getElementById("player");
  let controller = null, wanted = null;
  window.onSpotifyIframeApiReady = api => {
    const spot = el("div"); bar.append(spot);
    api.createController(spot, { width: "100%", height: 80 }, c => { controller = c; if (wanted) play(wanted); });
  };
  function play(id) {
    wanted = id; bar.hidden = false;
    document.querySelectorAll("[data-tid]").forEach(n => n.classList.toggle("playing", n.dataset.tid === id));
    if (!controller) return;  // the embed is still loading; it plays this song when ready
    controller.loadUri(`spotify:track:${id}`); controller.play();
  }

  // ---- page
  const map = moodMap(D, { name, label, song: id => song(id).join(" — "),
    playlists,
    help: "click a playlist below to pin it on the map · hover a dot to see a song" });
  const jumpTo = id => {
    const n = document.getElementById(`g-${id}`); if (!n) return;
    n.scrollIntoView({ behavior: "smooth", block: "start" });
    n.classList.add("flash"); setTimeout(() => n.classList.remove("flash"), 1600);
  };
  const songRow = id => {
    const [title, artists] = song(id);
    return el("div", { class: "song", "data-tid": id, onclick: () => play(id) },
      el("button", { class: "pb", title: "Play on Spotify" }, "▶"),
      el("div", { class: "nm", title: `${title} — ${artists}` }, title, el("small", {}, artists)), el("span"));
  };
  const card = g => {
    const merged = g.action.startsWith("merge:") ? +g.action.slice(6) : null;
    const state = g.action === "drop" ? " dropped" : merged !== null ? " merged" : g.name ? " named" : "";
    const close = (g.overlaps || []).filter(([, s]) => s >= 0.15).slice(0, 3);
    return el("div", { class: "g" + state, id: `g-${g.id}`, style: { "--gc": g.color },
                       onmouseenter: () => map.focus(g.id), onmouseleave: () => map.focus(null) },
      el("div", { class: "g-head" }, el("span", { class: "dot", style: { background: g.color } }),
        el("span", { class: "g-num" }, `Group ${g.id}`), el("div", { class: "g-name" }, g.name || "Unnamed")),
      el("div", { class: "g-meta" }, `${g.size} songs · ${g.desc}`,
        g.action === "drop" ? " · dropped" : merged !== null ? ` · merged into ${label(merged)}` : ""),
      close.length ? el("div", { class: "g-meta" }, "Overlaps most with: ", close.map(([id, s], i) => [i ? ", " : "",
        el("a", { onclick: () => jumpTo(id) }, `${label(id)} · ${Math.round(s * 100)}%`)])) : null,
      el("div", { class: "prof" }, D.cols.map((col, i) => {
        const w = Math.max(-2, Math.min(2, g.profile[i])) * 25;
        return el("div", { class: "pr", title: `${col}: ${g.profile[i] > 0 ? "+" : ""}${g.profile[i]} σ vs the whole library` }, col,
          el("i", {}, el("u", { style: { left: (50 + Math.min(0, w)) + "%", width: Math.abs(w) + "%" } })));
      })),
      g.typical.map(songRow),
      el("details", {}, el("summary", {}, "Edge of the group"), g.edge.map(songRow)));
  };
  document.getElementById("view").append(el("div", { class: "wrap" },
    el("h1", {}, D.title), el("p", { class: "lead" }, D.lead),
    map.node, el("div", { class: "groups" }, D.groups.map(card)),
    el("p", { class: "small mut" }, D.footer)));
})();
</script>
